version: 2
updates:
  # Actions are pinned to commit SHAs (with a version comment); Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
